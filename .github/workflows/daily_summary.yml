name: El Okaby Daily Summary (opt-in pilot)
on:
  schedule:
    - cron: '7 19 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: el-okaby-daily-summary
  cancel-in-progress: false
jobs:
  summary:
    if: vars.ENABLE_DAILY_SUMMARY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Send private Meta daily summary
        env:
          PYTHONPATH: .
          ENABLE_DAILY_SUMMARY: ${{ vars.ENABLE_DAILY_SUMMARY }}
          ALERT_ACTION_TYPE: ${{ vars.ALERT_ACTION_TYPE }}
          ALERT_TEMPLATE_NAME: ${{ vars.ALERT_TEMPLATE_NAME }}
          ALERT_TEMPLATE_LANGUAGE: ${{ vars.ALERT_TEMPLATE_LANGUAGE }}
          ALERT_RECIPIENT: ${{ secrets.ALERT_RECIPIENT }}
          META_TOKENS_JSON: ${{ secrets.META_TOKENS_JSON }}
          META_ACCOUNT_ALLOWLIST: ${{ vars.META_ACCOUNT_ALLOWLIST }}
          META_ACCOUNT_TOKEN_MAP_JSON: ${{ vars.META_ACCOUNT_TOKEN_MAP_JSON }}
          META_BUSINESS_IDS: ${{ vars.META_BUSINESS_IDS }}
          META_AGENT_MAP_JSON: ${{ vars.META_AGENT_MAP_JSON }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_WABA_ID: ${{ vars.WHATSAPP_WABA_ID }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ vars.WHATSAPP_PHONE_NUMBER_ID }}
        run: python -m engine.daily
